<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Beanie — 콩팥 건강 일지</title>
<meta name="description" content="My Beanie: 만성콩팥병 환자의 기록을 진료 전 한 장 리포트로. It's my health buddy. / Turn your CKD records into a one-page pre-visit report.">
<meta name="theme-color" content="#FF7B8E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Beanie">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- onboarding -->
  <section class="view" id="v-onboard">
    <div class="onb">
      <img src="icons/icon-192.png" alt="" class="onb-mascot">
      <h1 class="en">My Beanie</h1>
      <p class="sub" data-i18n="ob_sub"></p>
      <div class="seg lang-seg" id="ob-lang"><button data-v="ko">한국어</button><button data-v="en">English</button></div>
      <label><span data-i18n="ob_name"></span><input id="ob-name" data-i18n-ph="ob_name_ph" maxlength="16"></label>
      <label><span data-i18n="ob_year"></span><input id="ob-year" type="number" inputmode="numeric" data-i18n-ph="ob_year_ph" min="1920" max="2020"></label>
      <div class="seg" id="ob-sex">
        <button data-v="F" class="on" data-i18n="female"></button><button data-v="M" data-i18n="male"></button>
      </div>
      <label><span data-i18n="ob_visit"></span><input id="ob-visit" type="date"></label>
      <button class="btn primary" id="ob-go" data-i18n="ob_go"></button>
      <p class="tiny" data-i18n="disclaimer_short"></p>
    </div>
  </section>

  <!-- home -->
  <section class="view" id="v-home">
    <header class="top">
      <div><div class="hello" id="home-hello"></div><div class="en brand">My Beanie</div></div>
      <button class="icon-btn" data-go="settings" aria-label="Settings">⚙</button>
    </header>
    <div class="nudge" id="nudge"></div>
    <div class="kpis">
      <div class="kpi pink"><div class="k" data-i18n="egfr"></div><div class="v en" id="kpi-egfr">–</div><div class="d" id="kpi-egfr-d"></div></div>
      <div class="kpi mint"><div class="k" data-i18n="bp"></div><div class="v en" id="kpi-bp">–</div><div class="d" id="kpi-bp-d"></div></div>
      <div class="kpi blue"><div class="k" data-i18n="weight"></div><div class="v en" id="kpi-wt">–</div><div class="d" id="kpi-wt-d"></div></div>
    </div>
    <div class="card visit" id="visit-card"></div>
    <h2 class="h" data-i18n="recent"></h2>
    <div id="home-list" class="list"></div>
  </section>

  <!-- log -->
  <section class="view" id="v-log">
    <header class="top"><h1 data-i18n="log_title"></h1><span class="en" id="log-date"></span></header>
    <form id="log-form" class="form">
      <div class="grp">
        <div class="grp-t"><span data-i18n="labs"></span> <small data-i18n="labs_hint"></small></div>
        <label><span data-i18n="cr"></span><input name="cr" type="number" step="0.01" inputmode="decimal" data-i18n-ph="cr_ph"></label>
        <div class="egfr-preview" id="egfr-preview"></div>
        <label><span data-i18n="k"></span><input name="k" type="number" step="0.1" inputmode="decimal" data-i18n-ph="k_ph"></label>
        <label><span data-i18n="p"></span><input name="p" type="number" step="0.1" inputmode="decimal" data-i18n-ph="p_ph"></label>
      </div>
      <div class="grp">
        <div class="grp-t" data-i18n="daily"></div>
        <div class="row2">
          <label><span data-i18n="sbp"></span><input name="sbp" type="number" inputmode="numeric" placeholder="128"></label>
          <label><span data-i18n="dbp"></span><input name="dbp" type="number" inputmode="numeric" placeholder="79"></label>
        </div>
        <label><span data-i18n="wt"></span><input name="wt" type="number" step="0.1" inputmode="decimal" placeholder="62.4"></label>
      </div>
      <div class="grp">
        <div class="grp-t"><span data-i18n="signals"></span> <small data-i18n="signals_hint"></small></div>
        <div class="chips" id="sym-chips">
          <button type="button" data-s="swelling" data-i18n-sym></button><button type="button" data-s="fatigue" data-i18n-sym></button><button type="button" data-s="itching" data-i18n-sym></button>
          <button type="button" data-s="appetite" data-i18n-sym></button><button type="button" data-s="breath" data-i18n-sym></button><button type="button" data-s="headache" data-i18n-sym></button>
          <button type="button" data-s="foamy" data-i18n-sym></button><button type="button" data-s="nocturia" data-i18n-sym></button><button type="button" data-s="sleep" data-i18n-sym></button>
        </div>
      </div>
      <div class="grp">
        <div class="grp-t"><span data-i18n="food"></span> <small data-i18n="food_hint"></small></div>
        <div class="chips" id="food-chips">
          <button type="button" data-f="eatout" data-i18n-food></button><button type="button" data-f="delivery" data-i18n-food></button><button type="button" data-f="soup" data-i18n-food></button><button type="button" data-f="fruit" data-i18n-food></button>
          <button type="button" data-f="nuts" data-i18n-food></button><button type="button" data-f="dairy" data-i18n-food></button><button type="button" data-f="processed" data-i18n-food></button><button type="button" data-f="alcohol" data-i18n-food></button>
        </div>
        <input name="foodtext" type="text" maxlength="80" data-i18n-ph="food_ph" style="margin-top:12px">
        <div class="photo-row">
          <label class="photo-btn" for="food-photo"><span data-i18n="food_photo"></span></label>
          <input type="file" id="food-photo" accept="image/*" capture="environment" hidden>
          <div class="photo-prev" id="food-prev"></div>
        </div>
      </div>
      <div class="grp">
        <div class="grp-t" data-i18n="notes_lbl"></div>
        <textarea name="note" rows="3" data-i18n-ph="notes_ph"></textarea>
      </div>
      <button class="btn primary" type="submit" data-i18n="save"></button>
    </form>
  </section>

  <!-- trend -->
  <section class="view" id="v-trend">
    <header class="top"><h1 data-i18n="trend"></h1></header>
    <div class="seg" id="trend-seg">
      <button data-m="egfr" class="on">eGFR</button><button data-m="bp" data-i18n="bp_short"></button><button data-m="wt" data-i18n="weight"></button>
    </div>
    <div class="card"><canvas id="chart" height="220"></canvas><div class="chart-empty" id="chart-empty" data-i18n="chart_empty"></div></div>
    <div class="card tt" id="timetravel"></div>
  </section>

  <!-- report -->
  <section class="view" id="v-report">
    <header class="top"><h1 data-i18n="rep_title"></h1><span class="en tag">The One-Pager</span></header>
    <div class="card"><label><span data-i18n="period"></span><select id="rep-range"><option value="30" data-i18n="d30"></option><option value="90" selected data-i18n="d90"></option><option value="180" data-i18n="d180"></option></select></label></div>
    <article class="onepager" id="onepager"></article>
    <div class="row2">
      <button class="btn ghost" id="rep-print" data-i18n="print"></button>
      <button class="btn primary" id="rep-share" data-i18n="share"></button>
    </div>
  </section>

  <!-- settings -->
  <section class="view" id="v-settings">
    <header class="top"><button class="icon-btn" data-go="home">←</button><h1 data-i18n="settings"></h1></header>
    <div class="card form">
      <label><span data-i18n="st_name"></span><input id="st-name"></label>
      <label><span data-i18n="st_year"></span><input id="st-year" type="number"></label>
      <div class="seg" id="st-sex"><button data-v="F" data-i18n="female"></button><button data-v="M" data-i18n="male"></button></div>
      <label><span data-i18n="st_visit"></span><input id="st-visit" type="date"></label>
      <label><span data-i18n="st_lang"></span></label>
      <div class="seg" id="st-lang"><button data-v="ko">한국어</button><button data-v="en">English</button></div>
      <button class="btn primary" id="st-save" data-i18n="save"></button>
    </div>
    <div class="card form">
      <div class="grp-t" data-i18n="data"></div>
      <button class="btn ghost" id="st-export" data-i18n="export"></button>
      <button class="btn ghost" id="st-import" data-i18n="import"></button>
      <input type="file" id="st-file" accept="application/json" hidden>
      <button class="btn danger" id="st-reset" data-i18n="reset"></button>
    </div>
    <p class="tiny"><span data-i18n="st_foot"></span> · <a href="https://kidneybloom.com" id="site-link">kidneybloom.com</a></p>
  </section>
</div>

<nav class="tabbar" id="tabbar">
  <button data-go="home" class="on"><span>⌂</span><em data-i18n="tab_home"></em></button>
  <button data-go="log"><span>＋</span><em data-i18n="tab_log"></em></button>
  <button data-go="trend"><span>↗</span><em data-i18n="tab_trend"></em></button>
  <button data-go="report"><span>▤</span><em data-i18n="tab_report"></em></button>
</nav>

<div class="toast" id="toast"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
